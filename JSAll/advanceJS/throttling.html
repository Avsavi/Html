<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throttling</title>
    <style>
         body{
            height: 400px;
         }
    </style>
</head>
<body>
    
    <h1> throttling scrooll page </h1>
    <script>
        function throttle(func, limit) {
            let inThrottle; // flag to track state
            return function (...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => {
                        inThrottle = false;
                    }, limit);
                }
            };
        }
    
        function handleScroll() {
            console.log('scroll event triggered:', new Date().toLocaleString());
        }
    
        const throttleFile = throttle(handleScroll, 1000);
        window.addEventListener('scroll', throttleFile);
    </script>
    
</body>
</html>
