<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number </title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #111111;
            color: rgb(255, 255, 255);
            text-align: center;
        }
        .number{
            font-size: 6rem;
            width: 15rem;
            margin: 20px auto;
            background-color: rgb(47, 49, 48);
            color: yellow;
        }
        .score.guess .message .highscore{
            
            font-size: 1.5rem;
            text-align: center;
        }
        input.guess{
            width: 50px;
            height: 30px;
            font-size: 1.5rem;
            text-align: center;
        }
        button{
            font-size: 1.5rem;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <h1>Guess My Number</h1>
    <p class="message"> Start Guessing....!</p>
    <div class="number">?</div>
    <input type="number" class="guess" /><br><br>
    <button class="check">Check!</button> 
    <button class="again">Again!</button>
    <p>Score: <span class="score">20</span></p>
    <p>HighScore: <span class="highscore">0</span></p>

    <script src="guessnumberProject.js"></script>
</body>
</html>
