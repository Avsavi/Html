<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get API details</title>
</head>

<body>

    <h1>Fetch API Project</h1>
    <h2>fetch Get example</h2>
    <button id="getbtn">Get User </button>
    <p id="getOutput"></p>
    <h2> fetch Post example</h2>
    <form action="" id="postForm">
        <input type="text" placeholder=" enter title" id="title">
        <input type="text" placeholder="enter body" id="body">
        <button id="Submit"> Submit</button>
    </form>
    <p id="postdata"></p>
    <script>
        const getbtn = document.getElementById('getbtn');
        const getOutput = document.getElementById('getOutput');
        getbtn.addEventListener('click', () => {
            fetch('https://jsonplaceholder.typicode.com/users/1')
                .then(response => response.json())
                .then(data => {
                    getOutput.innerHTML = ` Name: ${data.name} <br> Email: ${data.email} <br> City: ${data.address.city}`;
                    
                    //getOutput.textContent = JSON.stringify(data);
                })
                .catch(error => console.error('Error:', error));
        });

        const postForm = document.getElementById('postForm');
        const postdata = document.getElementById('postdata');
        const titleInput = document.getElementById('title');
        const bodyInput = document.getElementById('body');
        const submitButton = document.getElementById('Submit');

        submitButton.addEventListener('click', (e) => {
            e.preventDefault();
            const title = titleInput.value;
            const body = bodyInput.value;

            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: title,
                    body: body,
                    userId: 1
                }
                )
            })
                .then(response => response.json())
                .then(data => {
                    // postdata.innerHTML = ` Post ID: ${data.id} <br> Title: ${data.title} <br> Body: ${data.body}`;
                    postdata.textContent = JSON.stringify(data);
                })
                .catch(error => console.error('Error:', error));
        })


    </script>
</body>

</html>
